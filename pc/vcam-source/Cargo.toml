[package]
name = "vcam-source"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The IMFMediaSource COM object (Milestone 1: a hardcoded test pattern, see src/lib.rs) is loaded
# by the Windows Frame Server process, so it must ship as a DLL, not link into acam.exe.
[lib]
# "rlib" so the create_camera bin (and any future tests) can `use vcam_source::...` — a
# cdylib-only crate emits no linkable metadata for same-package targets.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "create_camera"
path = "src/bin/create_camera.rs"

[dependencies]
anyhow = "1.0.104"
vcam-ipc = { path = "../vcam-ipc" }
# windows-implement's #[implement] macro expands to `::windows_core::...` paths directly, so this
# needs to be a direct dependency even though `windows` re-exports it as `windows::core`.
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
]
