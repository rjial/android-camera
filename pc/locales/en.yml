# ACAM PC app, English (base language and fallback for missing keys).
# To add a language, copy this file to <code>.yml (e.g. de.yml, pt-BR.yml) and translate the values.
# Rules (checked by `cargo test`): one `key: "value"` per line, same keys as this file,
# and keep every %{placeholder} unchanged.
_version: 1
language.name: "English"

cli.about: "Receive an Android camera stream (ACAM protocol): preview in a window and a v4l2loopback virtual webcam. Without --headless it opens the GUI; connection arguments become the initial values and connect right away."
cli.headless: "Run without a window (CLI mode)."
cli.host: "Phone IP. Leave empty together with --discover to find it automatically."
cli.port: "TCP port of the phone app."
cli.discover: "Find the phone via UDP broadcast on port 5001."
cli.token: "6-digit pairing token shown on the phone screen. Not needed for --usb."
cli.usb: "Connect over a USB cable (Android Open Accessory), without network and without ADB."
cli.usb_vid: "Extra USB vendor ID to try with --usb (hex, e.g. 1234) when the phone brand is not recognised."
cli.device: "Target v4l2loopback node."
cli.no_webcam: "Do not write to v4l2loopback (useful together with --dump)."
cli.dump: "Save the raw H.264 bitstream to a file (playable with ffplay)."
cli.size: "Requested resolution, also the webcam output size."
cli.fps: "Requested frame rate."
cli.bitrate: "Video bitrate in kbps."
cli.front: "Use the front camera."
cli.no_obs: "Do not share video with the \"ACAM Camera\" OBS plugin."
cli.lang: "Interface language (%{list}). Default: the language picked in the GUI, else the system language."
cli.unknown_lang: "unknown language \"%{lang}\"; available: %{list}"
cli.need_token: "--token <token on the phone screen> is required (or use --usb)"
cli.need_target: "--host <ip>, --discover or --usb is required"
cli.size_format: "format: WIDTHxHEIGHT, e.g. 1280x720"
cli.width_invalid: "invalid width"
cli.height_invalid: "invalid height"
cli.size_even: "width and height must be even and > 0"
cli.hex_invalid: "must be 4 hex digits, e.g. 04e8"
cli.commands: "commands: s = switch camera, k = request keyframe, b <kbps> = change bitrate, caps, status,"
cli.caps_missing: "capabilities not received yet"
cli.bitrate_invalid: "invalid bitrate"
cli.unknown_command: "unknown command"

