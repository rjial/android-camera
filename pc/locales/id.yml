# ACAM PC app, Bahasa Indonesia. Kunci dan %{placeholder} harus sama dengan en.yml.
_version: 1
language.name: "Bahasa Indonesia"

cli.about: "Terima stream kamera Android (protokol ACAM): preview di jendela dan webcam virtual v4l2loopback. Tanpa --headless membuka GUI; argumen koneksi dipakai sebagai nilai awal dan langsung tersambung."
