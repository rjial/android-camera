[workspace]
members = ["vcam-source", "vcam-ipc"]

[package]
name = "acam"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rjial/android-camera"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gpui = "0.2.2"
gpui-component = "=0.5.1"
image = "0.25"
libc = "0.2"
openh264 = "0.9.9"
rusb = { version = "0.9.4", features = ["vendored"] }
rust-i18n = "=3.1.5"
smallvec = "1"

# The Windows virtual webcam producer (src/vcam_windows.rs) is cfg(windows)-only, so its
# shared-memory transport is pulled in only there.
[target.'cfg(windows)'.dependencies]
vcam-ipc = { path = "vcam-ipc" }
# Media Foundation: the H.264 decoder MFT with DXVA (src/decode_mf.rs) and the virtual camera host
# (src/vcam_windows.rs); the named pipe and clock for the OBS plugin (src/share.rs).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# The per-frame video path (nearest-neighbour scaling, I420->NV12, the shared-memory copy) is in
# these crates. At the default dev opt-level 0 those tight pixel loops can't keep up with 30 fps and
# the stream backs up (latency grows); optimise just them so a debug build runs at full speed, while
# the heavy GUI dependencies stay unoptimised to keep incremental builds fast and small.
[profile.dev.package.acam]
opt-level = 3

[profile.dev.package.vcam-ipc]
opt-level = 3

[profile.dev.package.vcam-source]
opt-level = 3
