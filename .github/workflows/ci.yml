name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/version.sh check

  pc:
    name: acam (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for gpui
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb-xkb-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc
      - name: Test
        working-directory: pc
        run: cargo test --release --locked
      - name: Build
        working-directory: pc
        run: cargo build --release --locked

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug

  obs-plugin:
    name: OBS plugin (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: libobs headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libobs-dev
      - name: Build
        working-directory: obs-plugin
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
